name: spalding_phonograms
description: "A study app for all 70 Spalding phonograms."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  in_app_review: ^2.0.11
  url_launcher: ^6.2.0
  provider: ^6.1.0
  flutter_tts: ^4.2.0
  flutter_native_splash: ^2.4.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#000000"
  android: false
  ios: true
